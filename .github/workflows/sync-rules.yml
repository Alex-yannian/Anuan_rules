name: Sync upstream rules

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror rules and build self-hosted config
        run: python scripts/sync_rules.py --repository "${GITHUB_REPOSITORY}" --branch release

      - name: Prepare release branch contents
        shell: bash
        run: |
          publish="${RUNNER_TEMP}/anuan-rules-release"
          mkdir -p "${publish}/config"
          cp -R rules "${publish}/rules"
          cp config/Anuan.yaml "${publish}/config/Anuan.yaml"
          cp LICENSE SOURCES.md "${publish}/"
          printf '# Anuan_rules release\n\nGenerated by the main branch sync workflow.\n' > "${publish}/README.md"

      - name: Publish single-commit release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish="${RUNNER_TEMP}/anuan-rules-release"
          cd "${publish}"
          git init --initial-branch=release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync upstream rules"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin release
