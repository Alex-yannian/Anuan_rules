# Anuan OpenClash / Mihomo public configuration
# Repository: https://github.com/Alex-yannian/Anuan_rules
# Updated: 2026-06-21
# Public template: replace CHANGE_ME locally; never commit real credentials.
# 用途：路由器 OpenClash / Mihomo 规则。由第一份路由器规则为底稿，融合第二份电脑客户端细分类规则后改写。
# 核心：国外服务优先、国内规则后置；游戏联机/下载直连，游戏平台网页/社区/好友代理；IPv6 默认关闭；移除路由器无效的 PROCESS-NAME 规则。
# 注意：proxy-providers.subscription.url 仍需替换为你的真实 Clash 订阅链接。
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
external-controller: 0.0.0.0:9090
secret: CHANGE_ME
profile:
  store-selected: true
  store-fake-ip: true
geodata-mode: true
geox-url:
  geoip: https://raw.githubusercontent.com/Alex-yannian/Anuan_rules/release/rules/metacubex/geo/geoip.dat
  geosite: https://raw.githubusercontent.com/Alex-yannian/Anuan_rules/release/rules/metacubex/geo/geosite.dat
  mmdb: https://raw.githubusercontent.com/Alex-yannian/Anuan_rules/release/rules/metacubex/geo/geoip.metadb
  asn: https://raw.githubusercontent.com/Alex-yannian/Anuan_rules/release/rules/metacubex/geo/GeoLite2-ASN.mmdb
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  fake-ip-filter:
  - rule-set:Direct
  - rule-set:Private
  - rule-set:China
  - rule-set:fakeip_filter
  - '*.lan'
  - '*.local'
  - '*.localhost'
  - '*.localdomain'
  - router.asus.com
  - +.miwifi.com
  - localhost.ptlogin2.qq.com
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - time-ios.apple.com
  - '*.ntp.org.cn'
  - '*.openwrt.pool.ntp.org'
  - '*.pool.ntp.org'
  - ntp.*.com
  - '*.stun.*.*'
  - '*.stun.*.*.*'
  - stun.*.*.*
  - stun.*.*
  - '*.n.n.srv.nintendo.net'
  - '*.srv.nintendo.net'
  - '*.xboxlive.com'
  - xbox.*.microsoft.com
  - '*.battlenet.com.cn'
  - '*.wargaming.net'
  - '*.wowsgame.cn'
  - '*.wggames.cn'
  - music.163.com
  - '*.music.163.com'
  - '*.126.net'
  - '*.xiami.com'
  - '*.music.migu.cn'
  - +.pub.3gppnetwork.org
  - +.docker.io
  - +.market.xiaomi.com
  - +.push.apple.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    ipcidr:
    - 240.0.0.0/4
proxy-providers:
  subscription:
    type: http
    url: PUT_YOUR_CLASH_SUBSCRIPTION_URL_HERE
    interval: 86400
    path: ./proxy_providers/subscription.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204
proxy-groups:
- name: 直接连接
  type: select
  proxies:
  - DIRECT
- name: 节点选择
  type: select
  proxies:
  - 自动选择
  - 故障转移
  - 香港策略
  - 台湾策略
  - 狮城策略
  - 日本策略
  - 韩国策略
  - 美国策略
  - 欧盟策略
  - 冷门自选
  - 全球手动
  - 直接连接
  use:
  - subscription
- name: 自动选择
  type: url-test
  use:
  - subscription
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 故障转移
  type: fallback
  proxies:
  - 香港策略
  - 台湾策略
